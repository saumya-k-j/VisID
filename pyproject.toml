[project]
name = "visid"
version = "0.1.0"
description = "Image-grounded semantic IDs for cold-start generative retrieval"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "numpy", "pyyaml", "faiss-cpu", "matplotlib",
  "sentence-transformers>=2.7", "transformers>=4.40", "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["visid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
