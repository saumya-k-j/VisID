# Sandbox config: the exact Beauty 5-core sequences (S3Rec's copy, matches published stats)
# with brand/category attribute ids as the only item content. No titles, no images.
# Used to validate the pipeline on real interactions when the raw Amazon files are unavailable.
# The "attr" semantic IDs are a stand-in for text IDs, NOT the Sentence-T5 IDs of the study.
base: base.yaml
data:
  name: beauty_s3rec
  source: s3rec_txt
  reviews_file: Beauty.txt
  attr_file: Beauty_item2attributes.json
  expected_stats: {users: 22363, items: 12101, interactions: 198502}
embed:
  common_dim: 128
twotower:
  content: attr
bench:
  variants: [attr]
# CPU budget for the sandbox generator (2 CPU cores, no GPU): a smaller, shorter TIGER.
# The study itself uses the full base.yaml TIGER on a GPU.
tiger:
  n_enc_layers: 2
  n_dec_layers: 2
  d_ff: 512
  lr: 0.002
  warmup_steps: 300
  epochs: 12
  eval_every: 3
  patience: 3
  val_users: 2000
